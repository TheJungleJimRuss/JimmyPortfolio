<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jimmy Russ — Software &amp; Game Developer</title>
  </head>
  <body>
    <!-- ==================== GATEWAY HERO & DUAL-IDENTITY PORTAL ==================== -->
    <section id="viewGateway" class="wf-gateway-view" role="region" aria-label="Landing Gateway">
      <header class="wf-gateway-header">
        <button type="button" id="gatewayAudioToggle" class="wf-gateway-audio-minimal" aria-pressed="false" title="Toggle tactile sound effects [M]">
          <span class="wf-gateway-audio-dot" aria-hidden="true"></span>
          <span id="gatewayAudioLabel">SOUND: OFF</span>
          <span class="wf-gateway-audio-hint">[M]</span>
        </button>
      </header>

      <div class="wf-gateway-center">
        <div id="heroNameAnchor" class="wf-gateway-hero-anchor" data-state="none">
          <canvas id="hero3dCanvasGateway" class="wf-gateway-hero-canvas" aria-label="JIMMY RUSS 3D Solid Text"></canvas>
          <h1 id="heroNameText" class="wf-gateway-name">JIMMY RUSS</h1>
        </div>

        <nav id="gatewayPathways" class="wf-gateway-pathways-minimal" aria-label="Portfolio Pathways">
          <a href="./dev.html" id="gatewayDevBtn" class="wf-gateway-link is-dev" aria-label="Enter Dev &amp; Game Systems portfolio">
            <span class="wf-gateway-link-num">01 //</span>
            <span class="wf-gateway-link-text">Dev &amp; Game Systems</span>
          </a>
          <span class="wf-gateway-path-divider" aria-hidden="true">/</span>
          <button type="button" id="gatewayDroneBtn" class="wf-gateway-link is-drone" aria-label="Enter Aerial Flight Ops portfolio">
            <span class="wf-gateway-link-num">02 //</span>
            <span class="wf-gateway-link-text">Aerial Flight Ops</span>
          </button>
        </nav>
      </div>
    </section>

    <script type="module" src="/src/landing.ts"></script>
  </body>
</html>
