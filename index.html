<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Jimmy Russ — Software &amp; Game Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/wireframe.css" />
    <link rel="stylesheet" href="/src/styles/gateway.css" />
    <style>
      html, body {
        background-color: #000000 !important;
        background: #000000 !important;
        color: #ffffff;
        margin: 0;
        padding: 0;
      }
      .wf-gateway-view {
        position: fixed;
        inset: 0;
        height: 100vh;
        height: 100dvh;
        background: #070707;
        color: #e6e6e6;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: max(24px, env(safe-area-inset-top)) max(32px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(32px, env(safe-area-inset-left));
        box-sizing: border-box;
        animation: gatewayEntranceFade 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @media (prefers-reduced-motion: reduce) {
        .wf-gateway-view { animation: gatewayEntranceFadeReduced 0.2s linear both; }
      }
      @keyframes gatewayEntranceFadeReduced {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes gatewayEntranceFade {
        0% {
          opacity: 0;
          transform: scale(0.988);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .wf-gateway-hero-anchor.has-3d .wf-gateway-hero-canvas {
        display: block;
      }
      .wf-gateway-hero-anchor.has-3d .wf-gateway-name {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- ==================== GATEWAY HERO & DUAL-IDENTITY PORTAL ==================== -->
    <section id="viewGateway" class="wf-gateway-view" role="region" aria-label="Landing Gateway">
      <header class="wf-gateway-header">
        <button type="button" id="gatewayAudioToggle" class="wf-gateway-audio-minimal" aria-pressed="false" title="Toggle tactile sound effects [M]">
          <span class="wf-gateway-audio-dot" aria-hidden="true"></span>
          <span id="gatewayAudioLabel">SOUND: OFF</span>
          <span class="wf-gateway-audio-hint">[M]</span>
        </button>
      </header>

      <div class="wf-gateway-center">
        <div id="heroNameAnchor" class="wf-gateway-hero-anchor has-3d" data-state="none">
          <canvas id="hero3dCanvasGateway" class="wf-gateway-hero-canvas" aria-label="JIMMY RUSS 3D Solid Text"></canvas>
          <h1 id="heroNameText" class="wf-gateway-name">JIMMY RUSS</h1>
          <svg id="heroDragHint" class="wf-gateway-drag-hint" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false">
            <g class="wf-drag-hint-hand">
              <path d="M22 14a8 8 0 0 1-8 8" />
              <path d="M18 11v-1a2 2 0 0 0-2-2a2 2 0 0 0-2 2" />
              <path d="M14 10V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1" />
              <path d="M10 9.5V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v10" />
              <path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" />
            </g>
          </svg>
        </div>

        <nav id="gatewayPathways" class="wf-gateway-pathways-minimal" aria-label="Portfolio Pathways">
          <a href="./dev.html" id="gatewayDevBtn" class="wf-gateway-link is-dev" aria-label="Enter Dev &amp; Game Systems portfolio">
            <span class="wf-gateway-link-num">01 //</span>
            <span class="wf-gateway-link-text">Dev &amp; Game Systems</span>
          </a>
          <span class="wf-gateway-path-divider" aria-hidden="true">/</span>
          <button type="button" id="gatewayDroneBtn" class="wf-gateway-link is-drone" aria-label="Enter Aerial Flight Ops portfolio">
            <span class="wf-gateway-link-num">02 //</span>
            <span class="wf-gateway-link-text">Aerial Flight Ops</span>
          </button>
        </nav>
      </div>
    </section>

    <script type="module" src="/src/landing.ts"></script>
  </body>
</html>
